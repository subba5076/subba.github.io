  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      scroll-behavior: smooth;
      background: #121212;
      color: #fff;
      overflow-x: hidden;
      transition: background 0.5s, color 0.5s;
    }
    body.light-mode {
      background: #f5f5f5;
      color: #000;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px 40px;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
      transition: background 0.5s;
    }
    body.light-mode header {
      background: rgba(255, 255, 255, 0.9);
      color: black;
    }

    .toggle-btn {
      background: none;
      border: 1px solid #00e5ff;
      color: #00e5ff;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    section {
      padding: 100px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .profile-pic {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #00e5ff;
      box-shadow: 0 0 25px #00e5ff;
      margin-bottom: 20px;
    }

    .parallax {
      background-attachment: fixed;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      text-align: center;
    }

    .about, .projects, .experience, .contact {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 40px;
      margin: 40px auto;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      width: 90%;
      max-width: 1200px;
      text-align: center;
      
    }
    .contact,.skills{
        min-height: auto;
    }
    

    .section-title {
      font-size: 2.5rem;
      margin-bottom: 30px;
    }

    .button {
      margin-top: 20px;
      padding: 6px 14px;
      font-size: 0.9rem;
      background-color: #00e5ff;
      color: #000;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
    }

    footer {
      text-align: center;
      padding: 30px;
      font-size: 0.9rem;
      color: #ccc;
    }

    .social-icons {
      margin-top: 20px;
    }

    .social-icons a {
      margin: 0 10px;
      font-size: 1.5rem;
      color: #00e5ff;
      transition: transform 0.3s;
    }

    .social-icons a:hover {
      transform: scale(1.3);
    }

    /* Scrollbar styling */
    .card-container::-webkit-scrollbar {
      height: 8px;
    }

    .card-container::-webkit-scrollbar-thumb {
      background-color: #00e5ff;
      border-radius: 10px;
    }
    .fab-circle {
  background-color: #00e5ff;
  color: #000;
  width: 40px;
  height: 40px;
  display: flex;
  justify-content: center;
  align-items: center;
  border-radius: 50%;
  text-decoration: none;
  font-size: 1.2rem;
  box-shadow: 0 0 10px #00e5ff;
  transition: transform 0.2s;
}
.fab-circle:hover {
  transform: scale(1.1);
}
.skills {
  background: rgba(255, 255, 255, 0.05);
  border-radius: 20px;
  padding: 40px;
  margin: 40px auto;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.18);
  width: 90%;
  max-width: 1200px;
  text-align: center;
}
.skill-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 25px;
  margin-top: 30px;
}
.skill-item {
  width: 70px;
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 229, 255, 0.1);
  border: 1px solid #00e5ff;
  border-radius: 50%;
  transition: transform 0.3s;
}
.skill-item img {
  max-width: 40px;
  max-height: 40px;
}
.skill-item:hover {
  transform: scale(1.2);
}
.card-container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 30px;
}

.card-wrapper {
  width: 100%;
  max-width: 300px;
  flex: 1 1 250px;
}


.card {
  width: 100%;
  height: 100%;
  background: rgba(0, 229, 255, 0.1);
  border: 1px solid #00e5ff;
  border-radius: 20px;
  padding: 20px;
  text-align: left;
  overflow-wrap: break-word;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}


.card:hover {
  transform: scale(1.0); /* smaller scale to avoid overflowing */
  box-shadow: 0 0 20px #00e5ff;
}

@media (max-width: 768px) {
  .card-wrapper {
    max-width: 95%;
    flex: 1 1 100%;
  }

  .card {
    font-size: 0.95rem;
    padding: 16px;
  }
}
.logo-text {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.logo {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid #ddd;
}

.project-image {
  width: 100%;        /* or set a fixed width like 300px */
  max-width: 50%;
  height: auto;
  display: block;
  margin: 0 auto;     /* center the image */
  border-radius: 10px;
}
.card-container {
  display: flex;
  justify-content: center;
  padding: 2rem;
}

.project-card {
  background: #1e2a2f;
  border:1px solid #00ffff60; 
  border-radius: 12px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
  padding: 1rem;
  max-width: 500px;
  width: 100%;
  box-sizing: border-box;
  text-align: center;
}

.project-img {
  width: 100%;
  height: 80vh;
  border-radius: 10px;
}
.learn-btn {
  padding: 2px 6px;
  background-color: #00e5ff;
  
  text-decoration: none;
  border-radius: 5px;
  font-weight: bold;
  transition: background-color 0.3s ease;
}

.learn-btn:hover {
  background-color: #00e5ff;
}
.toggle-btn a{
  color: #00e5ff;          /* Text color */
  text-decoration: none;    /* Removes underline */
  display: inline-block;    /* Makes it behave like a block inside button */
  
}

.video-scroll {
  display: flex;
  flex-direction: row;
  overflow-x: auto;
  overflow-y: hidden;
  white-space: nowrap;
  padding: 20px;
  gap: 16px;
  scroll-behavior: smooth;
}

.video-scroll::-webkit-scrollbar {
  height: 8px;
}

.video-scroll::-webkit-scrollbar-thumb {
  background-color: #4CAF50;
  border-radius: 10px;
}

.video-card {
  flex: 0 0 auto; /* force it to not shrink and stay in one row */
  width: 300px;
  background-color: #1e1e1e;
  border: 1px solid #333;
  border-radius: 10px;
  padding: 10px;
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
  display: inline-block; /* critical for nowrap */
}

.video-card h3 {
  color: #4CAF50;
  margin: 8px 0;
  font-size: 1rem;
}

.video-card hr {
  border: none;
  border-top: 1px solid #444;
  margin-bottom: 8px;
}

.video-card iframe {
  width: 100%;
  height: 180px;
  border-radius: 6px;
}
